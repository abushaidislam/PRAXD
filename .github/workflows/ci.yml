name: PRAXD CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Code Quality & Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Automated Vitest Acceptance Suites
        run: npm run test

      - name: Run Production Next.js Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: "https://app.praxd.com"
          NODE_ENV: "production"

  database-integrity:
    name: Database Migrations & Checksum Verification
    runs-on: ubuntu-latest
    needs: quality-gate
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Migration File Checksums & Drift
        run: npx vitest run tests/phase9-production-cloud.test.ts -t "P9-02"

  deploy-preview:
    name: Vercel Preview & Staging Deployment
    runs-on: ubuntu-latest
    needs: [quality-gate, database-integrity]
    if: github.event_name == 'pull_request'
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Pull Request Preview
        run: |
          echo "Deploying preview for PR #${{ github.event.pull_request.number }}..."
          echo "Target preview URL: https://pr-${{ github.event.pull_request.number }}.preview.praxd.com"

  deploy-production:
    name: Production Release & KMS Sync
    runs-on: ubuntu-latest
    needs: [quality-gate, database-integrity]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production Deployment Gate
        run: |
          echo "All acceptance checks passed. Initiating zero-downtime production rollout to https://app.praxd.com..."
